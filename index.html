<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backup Code Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: #fff;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 25px;
      font-size: 28px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      resize: vertical;
      font-family: monospace;
      font-size: 15px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus {
      border-color: #555;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: #222;
    }

    button:hover {
      opacity: 0.85;
    }

    .copy {
      background: #16834b;
    }

    .clear {
      background: #d33;
    }

    .status {
      min-height: 20px;
      margin-top: 8px;
      font-size: 14px;
      color: #16834b;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Backup Code Converter</h1>

    <label for="input">Input</label>

    <textarea
      id="input"
      placeholder="Paste backup codes here...

Multiple lines supported:
6791 5960 9747 1955
6747 8823 8261 5295"
    ></textarea>

    <div class="buttons">
      <button onclick="convert()">Convert</button>
      <button class="copy" onclick="copyOutput()">Copy Output</button>
      <button class="clear" onclick="clearAll()">Clear</button>
    </div>

    <label for="output">Output</label>

    <textarea
      id="output"
      readonly
      placeholder="Converted output..."
    ></textarea>

    <div class="status" id="status"></div>

  </div>

  <script>

    function convert() {
      const input = document.getElementById("input").value;

      if (!input.trim()) {
        document.getElementById("output").value = "";
        document.getElementById("status").textContent = "";
        return;
      }

      // প্রতিটি line আলাদাভাবে process হবে
      const lines = input.split(/\r?\n/);

      const convertedLines = lines.map(line => {

        // Empty line হলে empty রাখবে
        if (!line.trim()) {
          return "";
        }

        // Spaces / Tabs দিয়ে code আলাদা করবে
        const codes = line.trim().split(/\s+/);

        const groups = [];

        // প্রতি ২টি code একসাথে
        for (let i = 0; i < codes.length; i += 2) {
          groups.push(
            codes.slice(i, i + 2).join(" ")
          );
        }

        // Group-এর মাঝে TAB
        return groups.join("\t");
      });

      // Original line structure বজায় থাকবে
      document.getElementById("output").value =
        convertedLines.join("\n");

      document.getElementById("status").textContent =
        "Converted successfully!";
    }


    async function copyOutput() {
      const output = document.getElementById("output").value;

      if (!output) {
        document.getElementById("status").textContent =
          "Nothing to copy.";
        return;
      }

      try {
        await navigator.clipboard.writeText(output);

        document.getElementById("status").textContent =
          "Output copied!";
      } catch (error) {

        const textarea = document.getElementById("output");

        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);

        document.execCommand("copy");

        document.getElementById("status").textContent =
          "Output copied!";
      }
    }


    function clearAll() {
      document.getElementById("input").value = "";
      document.getElementById("output").value = "";
      document.getElementById("status").textContent = "";
    }


    // Input / Paste করলেই automatically convert হবে
    document.getElementById("input").addEventListener(
      "input",
      convert
    );

  </script>

</body>
</html>
